corn-belt {
  anchor {
    station-id   = "GHCND:USC00250622"
    station-name = "Beatrice 1 N, NE US"
    latitude     = 40.2742
    longitude    = -96.7486
    county-fips  = "31067"
    state        = "NE"
    # Supplemental ASOS temperature station. Used in silver when anchor TMAX/TMIN
    # are missing and the pool median is also unavailable (e.g. recent weeks not
    # yet archived by NCEI). ASOS stations update near-real-time.
    # Run AbridgedIngestAddStation for this ID before running silver.
    temp-supplemental-id   = "GHCND:USW00014939"
    temp-supplemental-name = "Lincoln Airport ASOS (KLNK), NE"
  }
  states = ["NE", "KS", "IA", "MO", "IL", "IN", "OH", "SD"]
  crops  = ["CORN", "SOYBEANS", "WHEAT"]
  analysis {
    start-year = 2000
    end-year   = 2026
  }
  noaa {
    base-url   = "https://www.ncei.noaa.gov/access/services/data/v1"
    token      = ${?NOAA_TOKEN}
    dataset-id = "daily-summaries"
    data-types = ["TMAX", "TMIN", "PRCP", "SNOW", "SNWD"]
  }
  usda {
    base-url   = "https://quickstats.nass.usda.gov/api"
    api-key    = ${?USDA_NASS_KEY}
    statistics = ["YIELD", "PRICE RECEIVED", "AREA HARVESTED"]
  }
  paths {
    bronze = "data/bronze"
    silver = "data/silver"
    gold   = "data/gold"
    raw    = "data/raw"
  }
  spark {
    app-name = "CornBeltWeather"
    master   = "local[*]"
  }
}
